version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bliss-cafe
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafe_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_saas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files here run ONCE, in alphabetical order, only when the volume is first created.
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafe_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: cafe_saas_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # Backs the Socket.IO Redis adapter, which is what lets KDS displays on one
  # instance see order events published on another. Without REDIS_URL the app
  # still boots, but rooms are in-memory and only work single-instance.
  redis:
    image: redis:7-alpine
    container_name: cafe_saas_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: